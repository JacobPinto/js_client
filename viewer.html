<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ddd;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #2a2a2a;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
    }
    button {
      padding: 5px 12px;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #ddd;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #4a4a4a; }
    button:disabled { opacity: 0.4; cursor: default; }
    #status {
      font-size: 12px;
      color: #888;
    }
    #status.ok  { color: #6c6; }
    #status.err { color: #c66; }
    #values {
      margin-left: auto;
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
    }
    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
    }
    #hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <button id="btn-load">Load output.jpeg</button>
  <button id="btn-reset">Reset</button>
  <span id="status">Waiting for interaction…</span>
  <span id="values">pan(0, 0)  zoom 1.000  az 0.0°  el 0.0°</span>
</div>

<div id="canvas-container">
  <canvas id="canvas"></canvas>
  <div id="hint">Left-drag: pan &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Right-drag: azimuth/elevation</div>
</div>

<script>
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const status   = document.getElementById('status');
  const valLabel = document.getElementById('values');

  // ---------- state ----------------------------------------------------------
  let img     = null;
  let writing = false;

  const state = { pan_x: 0, pan_y: 0, zoom: 1.0, rotate_deg: 0.0, rotate_elev_deg: 0.0 };

  // ---------- load image -----------------------------------------------------
  document.getElementById('btn-load').addEventListener('click', async () => {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'JPEG Image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
      });
      const file = await handle.getFile();
      const url  = URL.createObjectURL(file);
      img = new Image();
      img.onload = () => {
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        drawImage();
      };
      img.src = url;
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('Failed to load image: ' + e.message, true);
    }
  });

  // Reload output.jpeg with a cache-busting timestamp so the browser always
  // fetches the latest version written by the render program.
  function reloadImage() {
    const probe = new Image();
    probe.onload = () => {
      img = probe;
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      drawImage();
    };
    probe.onerror = () => {
      setStatus('Unable to load output.jpeg', true);
    };
    probe.src = '/output.jpeg?t=' + Date.now();
  }

  reloadImage();                        // initial load
  setInterval(reloadImage, 80);       // refresh every 80 ms

  // ---------- reset ----------------------------------------------------------
  document.getElementById('btn-reset').addEventListener('click', () => {
    state.pan_x           = 0;
    state.pan_y           = 0;
    state.zoom            = 1.0;
    state.rotate_deg      = 0.0;
    state.rotate_elev_deg = 0.0;
    updateLabel();
    scheduleWrite();
  });

  // ---------- draw (image is NOT transformed — it always stays static) --------
  function drawImage() {
    if (!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  }

  // ---------- JSON write (debounced) -----------------------------------------
  let writeTimer = null;
  function scheduleWrite() {
    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeJSON, 80); // 80 ms debounce
  }

  async function writeJSON() {
    if (writing) return;
    writing = true;
    try {
      const payload = {
        pan:    { x: parseFloat(state.pan_x.toFixed(4)),
                  y: parseFloat(state.pan_y.toFixed(4)) },
        zoom:   parseFloat(state.zoom.toFixed(6)),
        rotate: {
          azimuth:   parseFloat(state.rotate_deg.toFixed(4)),
          elevation: parseFloat(state.rotate_elev_deg.toFixed(4))
        }
      };
      const res = await fetch('/camera', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        setStatus('camera.json updated', false);
      } else {
        setStatus('Server error: ' + res.status, true);
      }
    } catch (e) {
      setStatus('POST failed (is server running?): ' + e.message, true);
    } finally {
      writing = false;
    }
  }

  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className   = isErr ? 'err' : 'ok';
  }

  function updateLabel() {
    valLabel.textContent =
      `pan(${state.pan_x.toFixed(1)}, ${state.pan_y.toFixed(1)})` +
      `  zoom ${state.zoom.toFixed(3)}` +
      `  az ${state.rotate_deg.toFixed(1)}°` +
      `  el ${state.rotate_elev_deg.toFixed(1)}°`;
  }

  // ---------- mouse interactions (values only — image never moves) ------------
  let drag = null; // { type: 'pan'|'rotate', startX, startY, startPanX, startPanY, startRot }

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    if (e.button === 0) {
      // Left button → pan
      drag = { type: 'pan',
               startX: e.clientX, startY: e.clientY,
               startPanX: state.pan_x, startPanY: state.pan_y };
      canvas.style.cursor = 'grab';
    } else if (e.button === 2) {
      // Right button → rotate
      drag = { type: 'rotate',
               startX: e.clientX, startY: e.clientY,
               startRot: state.rotate_deg,
               startElev: state.rotate_elev_deg };
      canvas.style.cursor = 'move';
    }
  });

  window.addEventListener('mousemove', e => {
    if (!drag) return;
    if (drag.type === 'pan') {
      state.pan_x = drag.startPanX + (e.clientX - drag.startX);
      state.pan_y = drag.startPanY + (e.clientY - drag.startY);
    } else if (drag.type === 'rotate') {
      // 1 px horizontal drag = 0.3 degrees azimuth; vertical = elevation
      state.rotate_deg      = drag.startRot  + (e.clientX - drag.startX) * 0.3;
      state.rotate_elev_deg = drag.startElev + (e.clientY - drag.startY) * 0.3;
    }
    updateLabel();
    scheduleWrite();
  });

  window.addEventListener('mouseup', () => {
    drag = null;
    canvas.style.cursor = 'crosshair';
  });

  // Scroll → zoom
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.05 : 1 / 1.05;
    state.zoom = Math.max(0.01, Math.min(100, state.zoom * factor));
    updateLabel();
    scheduleWrite();
  }, { passive: false });

  // Initial label
  updateLabel();
</script>
</body>
</html>
